[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "l1nkzip"
version = "0.2.0"
description = "CLI for the l1nk.zip URL shortener"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich",
    "httpx",
    "typer",
]

[project.scripts]
l1nkzip = "main:main"

[tool.setuptools]
py-modules = ["main"]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "ruff>=0.12.7",
    "pytest>=9.0.3",
]
